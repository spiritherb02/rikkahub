name: Fork Build (共存版)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web-ui dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleGithubDebug -x lint

      - name: Collect APK
        run: |
          mkdir -p out
          find app/build/outputs/apk -name "*.apk" -exec cp {} out/ \;
          ls -lh out

      - name: Publish to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lihua-build
          name: 共存版构建
          prerelease: true
          body: |
            基于 master 构建，applicationId = me.rerere.rikkahub.lihua.debug
            改动：/models 的 name 字段作为模型显示名
          files: out/*.apk
